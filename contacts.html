<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты — Repin</title>

  <script src="script.js"></script>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Repin</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="about.html" class="nav-link">Обо мне</a>
        <a href="projects.html" class="nav-link">Проекты</a>
        <a href="contacts.html" class="nav-link active">Контакты</a>
      </div>
      <button class="theme-toggle" aria-label="Переключить тему">🌙</button>
    </nav>
  </header>

  <main class="contacts-section">
    <div class="container">
      <h1 class="section-title reveal">Связаться со мной</h1>
      <p class="section-subtitle reveal">
        Расскажите немного о задаче или проекте — отвечу, как только смогу.
      </p>

      <form class="contact-form reveal" id="contactForm">
        <div class="form-row">
          <div class="form-field">
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" placeholder="Ваше имя" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="topic">Тип запроса</label>
            <select id="topic" name="topic">
              <option value="site">Заказ сайта / лендинга</option>
              <option value="frontend">Фронтенд-задача / верстка</option>
              <option value="study">Вопрос по обучению</option>
              <option value="other">Другое</option>
            </select>
          </div>
          <div class="form-field">
            <label for="tg">Telegram (опционально)</label>
            <input type="text" id="tg" name="tg" placeholder="@username" />
          </div>
        </div>

        <div class="form-field">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" rows="7" placeholder="Опишите задачу или идею" required></textarea>
        </div>

        <div class="form-footer">
          <label class="checkbox-label">
            <input type="checkbox" id="agree" required />
            <span>Я согласен(а) на обработку персональных данных</span>
          </label>
          <button type="submit" class="btn">Отправить</button>
        </div>

        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>

      <div class="social-links reveal">
        <a href="mailto:dmrepin26@yandex.ru">Email</a>
        <a href="https://t.me/Repin26" target="_blank">Telegram</a>
        <a href="https://github.com/RepinDM" target="_blank">GitHub</a>
      </div>
    </div>
  </main>

  <footer>
    <p>Repin D.A.</p>
  </footer>
</body>
</html>
