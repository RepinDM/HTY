<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Контакты — Repin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {
      try {
        const stored = localStorage.getItem('theme');
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">REPIN</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="about.html" class="nav-link">Обо мне</a>
        <a href="projects.html" class="nav-link">Проекты</a>
        <a href="contacts.html" class="nav-link active">Контакты</a>
      </div>
      <button class="theme-toggle" aria-label="Переключить тему">🌙</button>
    </nav>
  </header>

  <main>
    <section class="contacts-section">
      <div class="container">
        <h1 class="section-title">Связаться со мной</h1>
        <p class="section-subtitle">
          Расскажите о задаче, и я отвечу, как могу помочь с вёрсткой или фронтендом.
        </p>
      </div>

      <form class="contact-form" id="contact-form">
        <div class="form-row">
          <div class="form-field">
            <label for="name">Имя</label>
            <input id="name" name="name" type="text" placeholder="Ваше имя" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="type">Тип запроса</label>
            <select id="type" name="type">
              <option>Заказ сайта / лендинга</option>
              <option>Правки и доработки</option>
              <option>Верстка по макету</option>
              <option>Другое</option>
            </select>
          </div>
          <div class="form-field">
            <label for="telegram">Telegram (опционально)</label>
            <input id="telegram" name="telegram" type="text" placeholder="@username" />
          </div>
        </div>

        <div class="form-field">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" placeholder="Опишите задачу или идею" required></textarea>
        </div>

        <div class="form-footer">
          <label class="checkbox-label">
            <input type="checkbox" id="agree" required />
            <span>Я согласен(а) на обработку персональных данных</span>
          </label>
          <button type="submit" class="btn">Отправить</button>
        </div>

        <div class="form-status" id="form-status"></div>
      </form>

      <div class="social-links">
        <a href="mailto:you@example.com">Email</a>
        <a href="https://t.me/username" target="_blank" rel="noreferrer">Telegram</a>
        <a href="https://github.com/RepinDM" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </section>
  </main>

  <footer>
    © 2025 Repin. Сделано с любовью к фронтенду.
  </footer>

  <script src="script.js"></script>
</body>
</html>
